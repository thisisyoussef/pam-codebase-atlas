name: CI

on:
  pull_request:
    paths:
      - content/**/*.md
      - scripts/**
      - src/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - tsconfig.json
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate atlas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate deterministic manifest
        run: npm run generate:local

      - name: Build
        run: npm run build
