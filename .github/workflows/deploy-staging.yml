name: Deploy Staging

on:
  push:
    branches:
      - main
    paths:
      - content/**/*.md
      - scripts/generate-onboarding-manifest.mjs
      - src/**
      - package.json
      - package-lock.json
      - railway.toml
      - server.mjs
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Generate and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      ONBOARDING_MD_PATH: content/onboarding.md
      REQUIRE_LLM: "1"
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME || 'pam-codebase-atlas' }}
      RAILWAY_ENVIRONMENT: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate LLM atlas manifest
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway staging
        run: bash scripts/deploy-railway-and-wait.sh
